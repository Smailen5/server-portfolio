name: Auto-add issue to project

on:
  issues:
    types: [opened]
  workflow_dispatch:

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/Smailen5/projects/1
          github-token: ${{ secrets.PROJECT_TOKEN }}
